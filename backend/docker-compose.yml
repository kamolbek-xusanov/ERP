services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eduvia
      POSTGRES_PASSWORD: eduvia
      POSTGRES_DB: eduvia
    ports:
      - "5432:5432"
    volumes:
      - eduvia_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduvia"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://eduvia:eduvia@db:5432/eduvia
      DB_SYNC: "true"
      JWT_ACCESS_SECRET: change-me-access-secret-min-32-chars
      JWT_REFRESH_SECRET: change-me-refresh-secret-min-32-chars
      CORS_ORIGINS: http://localhost:5173
      UPLOAD_DIR: /app/uploads
    ports:
      - "3000:3000"
    volumes:
      - eduvia_uploads:/app/uploads
volumes:
  eduvia_pg:
  eduvia_uploads:
